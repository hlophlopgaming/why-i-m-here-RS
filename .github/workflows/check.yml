name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libwayland-dev wayland-protocols \
            libxkbcommon-dev libdbus-1-dev libpango1.0-dev libcairo2-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify native Wayland backend
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path;
          assert any('#define FLTK_USE_WAYLAND 1' in p.read_text()
          for p in Path('target/debug/build').glob('fltk-sys-*/out/include/FL/fl_config.h')),
          'FLTK was built without native Wayland support'"
      - run: git diff --check
